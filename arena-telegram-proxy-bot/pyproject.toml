[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arena-telegram-proxy-bot"
version = "0.1.0"
description = "Telegram proxy bot for Arena.ai using aiogram and Playwright."
requires-python = ">=3.11,<3.14"
dependencies = [
    "aiogram>=3.13,<4",
    "beautifulsoup4>=4.12,<5",
    "httpx>=0.27,<1",
    "loguru>=0.7,<1",
    "playwright>=1.45,<2",
    "pydantic-settings>=2.4,<3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
